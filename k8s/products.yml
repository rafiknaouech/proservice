apiVersion: apps/v1
kind: Deployment
metadata:
  name: products
  namespace: proservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
    spec:
      containers:
        - name: products
          image: ghcr.io/rafiknaouech/proservice/products:latest
          ports:
            - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: products
  namespace: proservice
spec:
  selector:
    app: products
  ports:
    - port: 8002
      targetPort: 8002
