apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
  namespace: proservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer
  template:
    metadata:
      labels:
        app: customer
    spec:
      containers:
        - name: customer
          image: ghcr.io/rafiknaouech/proservice-customer:latest
          ports:
            - containerPort: 8001

---
apiVersion: v1
kind: Service
metadata:
  name: customer
  namespace: proservice
spec:
  selector:
    app: customer
  ports:
    - port: 8001
      targetPort: 8001
