apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping
  namespace: proservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping
  template:
    metadata:
      labels:
        app: shopping
    spec:
      containers:
        - name: shopping
          image: ghcr.io/rafiknaouech/proservice-shopping:latest
          ports:
            - containerPort: 8003

---
apiVersion: v1
kind: Service
metadata:
  name: shopping
  namespace: proservice
spec:
  selector:
    app: shopping
  ports:
    - port: 8003
      targetPort: 8003
