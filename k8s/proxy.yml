apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: proservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
        - name: proxy
          image: ghcr.io/rafiknaouech/proservice-proxy:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: proservice
spec:
  type: NodePort
  selector:
    app: proxy
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
